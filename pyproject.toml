[build-system]
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "opentradeintel"
version = "0.2.0"
description = "Open-source procurement and B2B sourcing intelligence engine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "b2baitrade-ui" }]
keywords = ["procurement", "sourcing", "tenders", "rfq", "trade-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx2>=2.12,<3",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/b2baitrade-ui/opentradeintel"
Documentation = "https://github.com/b2baitrade-ui/opentradeintel/tree/main/docs"
Issues = "https://github.com/b2baitrade-ui/opentradeintel/issues"
Repository = "https://github.com/b2baitrade-ui/opentradeintel"
Changelog = "https://github.com/b2baitrade-ui/opentradeintel/blob/main/CHANGELOG.md"

[project.scripts]
opentradeintel = "opentradeintel.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<3",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "twine>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentradeintel"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not live'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: calls an official public external service and is excluded by default",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opentradeintel"]
mypy_path = ["src"]
