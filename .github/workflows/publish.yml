name: Publish

on:
  release:
    types:
      - published

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-groups --locked --python "3.12"

      - name: Verify version sources agree with release tag
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          distribution_version="$(uv run python -c 'from importlib.metadata import version; print(version("opentradeintel"))')"
          module_version="$(uv run python -c 'import opentradeintel; print(opentradeintel.__version__)')"
          test "${distribution_version}" = "${module_version}"
          test "v${distribution_version}" = "${GITHUB_REF_NAME}"

      - name: Run release quality gates
        run: |
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests benchmarks examples
          uv run pytest
          uv run python benchmarks/run.py

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify built artifact version
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          built_version="$(uv run python -c 'import email, sys, zipfile; archive = zipfile.ZipFile(sys.argv[1]); metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA")); print(email.message_from_bytes(archive.read(metadata))["Version"])' "${wheel}")"
          test "v${built_version}" = "${GITHUB_REF_NAME}"

      - name: Validate distribution metadata
        run: uv run twine check dist/*

      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/opentradeintel
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions-${{ github.run_attempt }}
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          print-hash: true
