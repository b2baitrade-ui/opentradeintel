name: Bug report
description: Report a reproducible defect using non-sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private tenders, supplier data, or vulnerability details. Security reports belong in the private reporting flow.
  - type: input
    id: version
    attributes:
      label: OpenTradeIntel version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and installation method.
      placeholder: Windows 11, Python 3.14, uv 0.12
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence and synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, paths, and confidential commercial data first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I confirm this report contains no secrets or confidential procurement/supplier data.
          required: true
